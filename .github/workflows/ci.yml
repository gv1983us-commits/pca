name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test-only Schema oracle
        run: python -m pip install "jsonschema>=4.20,<5"

      - name: Compile validator and verification checks
        run: python -m compileall -q validator verification

      - name: Parse canonical JSON surfaces
        run: |
          python -m json.tool ARTIFACT.json > /dev/null
          python -m json.tool schema/pca-transition-record.schema.json > /dev/null

      - name: Run validator, regression, and Schema-parity suite
        run: python -m unittest discover -s validator -p "test_*.py" -v

      - name: Run artifact and fixed-revision verification gates
        run: python -m unittest discover -s verification -p "test_*.py" -v

      - name: Validate canonical positive fixtures
        run: |
          python validator/pca_validate.py conformance/fixtures/01-valid-continuation-claim.json --quiet
          python validator/pca_validate.py conformance/fixtures/05-valid-usage-mode-translation.json --quiet
